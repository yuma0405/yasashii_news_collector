name: Collect gentle news

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 日本時間 朝7:00
    - cron: '0 10 * * *'   # UTC 10:00 = 日本時間 夜19:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 収集スクリプトを実行
        run: python collector.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "yasashii-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json seen.json
          if ! git diff --staged --quiet; then
            git commit -m "やさしいニュースを更新"
            git push
          else
            echo "更新はありませんでした"
          fi
